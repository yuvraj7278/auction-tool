<script>
function evaluateGroup() {
    let e1Val = parseInt(document.getElementById('e1').value);
    let e2Val = parseInt(document.getElementById('e2').value);
    let e3Val = parseInt(document.getElementById('e3').value);

    let totalScore = e1Val + e2Val + e3Val;
    let resultDiv = document.getElementById('result');
    resultDiv.style.display = "block";

    let advice = "";
    let cssClass = "";

    // Decision Logic based on total 2025/historical point thresholds
    if (totalScore >= 700) {
        cssClass = "buy";
        advice = `🔥 <strong>STRONG BUY / BID HARD!</strong><br>Combined Group Score: <strong>${totalScore} pts</strong>.<br>This is an elite package with massive point-scoring floor. Target this to lock in your single group!`;
    } else if (totalScore >= 550) {
        cssClass = "buy";
        advice = `✅ <strong>GOOD VALUE - BID MODERATE</strong><br>Combined Group Score: <strong>${totalScore} pts</strong>.<br>Solid balanced package. Worth grabbing if purse allows, but don't overspend past 5-6k.`;
    } else {
        cssClass = "pass";
        advice = `❌ <strong>PASS / LET GO UNSOLD</strong><br>Combined Group Score: <strong>${totalScore} pts</strong>.<br>Low point yield. Let this group go unsold so it enters the 2-chance reshuffle loop for better combinations!`;
    }

    resultDiv.className = cssClass;
    resultDiv.innerHTML = advice;
}
</script>
